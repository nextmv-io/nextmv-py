# This manifest holds the information the app needs to run on Nextmv.

# Type and runtime specify the language and environment of the app.
type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11

# Python-specific configurations.
python:
  # All listed packages will get bundled with the app.
  pip-requirements: requirements.txt

# List all files/directories that should be included in the app. Globbing
# (e.g.: configs/*.json) is supported.
files:
  - main.py
  - visualizations.py

# Application configurations.
configuration:
  # Define the content format of the app, one of: json, multi-file.
  content:
    format: "json" # Read JSON from stdin and write JSON to stdout.
  # Define the options (parameters) of the app.
  options:
    strict: false
    items:
      - name: duration
        option_type: int
        default: 30
        description: Max solver runtime in seconds
        required: false
        additional_attributes:
          min: 1
          max: 300
          step: 10
        ui:
          control_type: slider
          display_name: Duration
      - name: solver
        option_type: string
        default: highs
        description: Solver to use for optimization
        required: false
        additional_attributes:
          values:
            - highs
            - glpk
            - cbc
        ui:
          control_type: select
          display_name: Solver
      - name: extended_day_time
        option_type: int
        default: 17
        description: Latest extended day end time (24-hour format)
        required: false
        additional_attributes:
          min: 15
          max: 18
          step: 1
        ui:
          control_type: slider
          display_name: Extended Day End Time
      - name: extended_day_bonus
        option_type: float
        default: 2.0
        description: Bonus multiplier for granting extended day (scaled by student priority)
        required: false
        additional_attributes:
          min: 0.0
          max: 10.0
          step: 0.5
        ui:
          control_type: slider
          display_name: Extended Day Bonus
      - name: extended_day_penalty
        option_type: float
        default: 0.5
        description: Penalty per hour past standard end of school day
        required: false
        additional_attributes:
          min: 0.0
          max: 5.0
          step: 0.25
        ui:
          control_type: slider
          display_name: Extended Day Penalty
