# This manifest holds the information the app needs to run on Nextmv.

# Type and runtime specify the language and environment of the app.
type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11

# Python-specific configurations.
python:
  # All listed packages will get bundled with the app.
  pip-requirements: requirements.txt

# List all files/directories that should be included in the app. Globbing
# (e.g.: configs/*.json) is supported.
files:
  - main.py
  - visuals.py

# Application configurations.
configuration:
  # Define the content format of the app, one of: json, multi-file.
  content:
    format: "json" # Read JSON from stdin and write JSON to stdout.
  # Define the options (parameters) of the app.
  options:
    strict: false
    items:
      - name: penalty_unmet_demand
        option_type: float
        default: 100
        description: ""
        required: false
        additional_attributes:
          min: 0
          max: 1000
          step: 10
        ui:
          control_type: slider
          display_name: Penalty for Unmet Demand (per unit)
      - name: supply_utilization_min
        option_type: float
        default: 0
        description: ""
        required: false
        additional_attributes:
          min: 0
          max: 1
          step: 0.05
        ui:
          control_type: slider
          display_name: Min Supply Utilization (fraction)
      - name: cost_threshold
        option_type: float
        default: 0
        description: ""
        required: false
        ui:
          control_type: input
          display_name: Max Lane Cost (0 = no limit)
      - name: time_limit
        option_type: float
        default: 30
        description: ""
        required: false
        additional_attributes:
          min: 5
          max: 300
          step: 5
        ui:
          control_type: slider
          display_name: Solver Time Limit (seconds)
