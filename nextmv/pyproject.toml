[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >= 1.13.0"]

[project]
authors = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.11.0",
    "urllib3>=2.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "typer>=0.27.1",
    "folium>=0.20.0",
    "plotly>=6.0.1",
    "questionary>=2.1.1",
    "truststore>=0.10.0",
    "uv>=0.9.29",
    "tomli>=2.4.1 ; python_full_version < '3.11'",
    "mcp[cli,mcp]>=1.2.0",
]
description = "The all-purpose Python SDK for Nextmv"
dynamic = [
    "version",
]
keywords = [
    "decision engineering",
    "decision science",
    "decisions",
    "nextmv",
    "optimization",
    "operations research",
    "shift scheduling",
    "solver",
    "vehicle routing problem",
]
license = { file = "LICENSE" }
maintainers = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
name = "nextmv"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://www.nextmv.io"
Documentation = "https://nextmv-py.docs.nextmv.io/en/latest/nextmv/"
Repository = "https://github.com/nextmv-io/nextmv-py"

[project.scripts]
nextmv = "nextmv.cli.main:main"

# Dependencies that are optional for the end user to install.
[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.2.0",
]
notebook = [
    "mlflow>=3.9.0",
]

[dependency-groups]
# Dependencies for development and testing.
dev = [
    "ruff==0.16.3",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "pytest==9.0.2",
    "nextpipe==0.6.0",
]

[tool.hatch.version]
path = "nextmv/__about__.py"
