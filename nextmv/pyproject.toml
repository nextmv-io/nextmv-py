[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >= 1.13.0"]

[project]
authors = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.11.0",
    "urllib3>=2.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "typer>=0.27.1",
    "folium>=0.20.0",
    "plotly>=6.0.1",
    "questionary>=2.1.1",
    "truststore>=0.10.0",
    "uv>=0.9.29",
    "tomli>=2.4.1 ; python_full_version < '3.11'",
]
description = "The all-purpose Python SDK for Nextmv"
dynamic = [
    "version",
]
keywords = [
    "decision engineering",
    "decision science",
    "decisions",
    "nextmv",
    "optimization",
    "operations research",
    "shift scheduling",
    "solver",
    "vehicle routing problem",
]
license = { file = "LICENSE" }
maintainers = [
    { email = "tech@nextmv.io", name = "Nextmv" }
]
name = "nextmv"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://www.nextmv.io"
Documentation = "https://docs.nextmv.io/python-sdk"
Repository = "https://github.com/nextmv-io/nextmv-py"

[project.scripts]
nextmv = "nextmv.cli.main:main"

# Dependencies that are optional for the end user to install.
[project.optional-dependencies]
mcp = [
    "mcp[cli]>=2.0.0",
]

[dependency-groups]
# Dependencies for development and testing.
dev = [
    "ruff==0.16.3",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "pytest==9.0.3",
    "nextpipe==0.7.0",
]

[tool.uv]
# `cryptography` arrives transitively, via `mcp` -> `pyjwt[crypto]`, and it
# publishes arm64-only macOS wheels from 49.0.0 on. On Intel macOS it is
# therefore built from source against Homebrew's OpenSSL, while PyInstaller
# bundles the interpreter's older `libssl.3.dylib` alongside it, so the frozen
# binary cannot load the extension module: `Symbol not found:
# _SSL_get0_group_name`. 48.0.1 is the last release with a universal2 wheel,
# which links OpenSSL statically and sidesteps the mismatch entirely.
#
# This constrains resolution only — the lockfile, CI, and the single-binary
# build. The published package caps nothing.
constraint-dependencies = [
    "cryptography<49 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.hatch.version]
path = "nextmv/__about__.py"
