name: release-winget
run-name: Winget release for ${{ github.event.release.tag_name || inputs.version }}

on:
  # We are reacting on all release creations ('created').
  # Pre-releases are filtered out in the job condition below.
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to submit (e.g. nextmv-v0.1.2, v0.1.2, or 0.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-winget:
    name: Release winget package
    # For release events: only run for full (non-pre-release) nextmv- releases.
    # (Filter out nextmv-gurobipy- and nextmv-scikit-learn- tags)
    # For manual dispatch: always run (caller is responsible for passing a stable version).
    if: |
      (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'nextmv-') &&
        !contains(github.event.release.tag_name, 'gurobipy') &&
        !contains(github.event.release.tag_name, 'scikit-learn')
      )
    runs-on: windows-latest
    steps:
      - name: resolve tag name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#nextmv-}"  # strip 'nextmv-' prefix if present
          VERSION="${VERSION#v}"     # strip leading 'v' if present
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"

      - name: install wingetcreate
        shell: bash
        run: |
          winget install wingetcreate --disable-interactivity --accept-source-agreements

      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh repo sync merschformann/winget-pkgs --branch master

      - name: submit winget PR
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          wingetcreate update Nextmv.CLI \
            --version "$VERSION" \
            --urls "https://github.com/nextmv-io/nextmv-py/releases/download/nextmv-v${VERSION}/nextmv-windows-x64.exe|x64|portable" \
            --submit \
            --token "$WINGET_TOKEN"
