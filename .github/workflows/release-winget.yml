name: release-winget
run-name: Winget release for ${{ inputs.version }}

# This workflow is a manual escape hatch for (re-)submitting a winget package.
# The normal, automated path lives in release.yml, which submits winget as part
# of the release run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to submit (e.g. nextmv-v0.1.2, v0.1.2, or 0.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-winget:
    name: Release winget package
    runs-on: windows-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: resolve version
        id: version
        shell: bash
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUTS_VERSION#nextmv-}"  # strip 'nextmv-' prefix if present
          VERSION="${VERSION#v}"               # strip leading 'v' if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"

      - name: submit winget package
        uses: ./.github/actions/submit-winget
        with:
          version: ${{ steps.version.outputs.version }}
          winget-token: ${{ secrets.WINGET_TOKEN }}
