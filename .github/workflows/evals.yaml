name: MCP Evals

on:
  pull_request:
    paths:
      - "nextmv/nextmv/evals/**"
      - "nextmv/nextmv/cli/mcp/**"
      - "nextmv/tests/evals/**"
  workflow_dispatch:
    inputs:
      run_llm_evals:
        description: "Run LLM evals (requires API keys in secrets)"
        type: boolean
        default: false
      provider:
        description: "LLM provider to eval"
        type: choice
        options:
          - anthropic
          - openai
          - all
        default: anthropic

jobs:
  deterministic:
    name: Deterministic Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: nextmv
        run: pip install -e ".[mcp,evals]" pytest
      - name: Run deterministic evals
        working-directory: nextmv
        run: pytest tests/evals/ -v -m "not llm"

  llm-anthropic:
    name: LLM Evals (Anthropic)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_llm_evals &&
      (inputs.provider == 'anthropic' || inputs.provider == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: nextmv
        run: pip install -e ".[mcp,evals]" pytest
      - name: Run Anthropic evals
        working-directory: nextmv
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/evals/test_llm.py::TestAnthropicEvals -v -s

  llm-openai:
    name: LLM Evals (OpenAI)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_llm_evals &&
      (inputs.provider == 'openai' || inputs.provider == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: nextmv
        run: pip install -e ".[mcp,evals]" pytest
      - name: Run OpenAI evals
        working-directory: nextmv
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/evals/test_llm.py::TestOpenAIEvals -v -s
