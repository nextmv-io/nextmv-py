name: single binary build
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  single-binary-build:
    name: Single binary build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Keep this in line with the matrix in the release workflow to ensure tests are accurate
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - os: macos
            arch: x64
            runner: macos-15-intel
            ext: ""
          - os: macos
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: windows
            arch: x64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup Python
        uses: actions/setup-python@v6

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller uv
          pip install .
        working-directory: nextmv/

      - name: build binary with PyInstaller
        shell: bash
        # Binary will be located at dist/nextmv (or dist/nextmv.exe on Windows)
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            ADD_DATA_SEPARATOR=";"
          else
            ADD_DATA_SEPARATOR=":"
          fi

          # Resolve the path to the uv binary shipped with the uv Python package.
          # We bundle it under the "uv_bin" sub-directory so executor.py can find
          # it at runtime via sys._MEIPASS/uv_bin/uv[.exe].
          UV_BIN=$(python -c "from uv import find_uv_bin; print(find_uv_bin())")
          echo "Bundling uv binary from: $UV_BIN"

          pyinstaller \
            --name nextmv \
            --onefile \
            --add-data "nextmv/templates${ADD_DATA_SEPARATOR}nextmv/templates" \
            --add-data "nextmv/local/executor.py${ADD_DATA_SEPARATOR}nextmv/local" \
            --add-data "${UV_BIN}${ADD_DATA_SEPARATOR}uv_bin" \
            --console nextmv/cli/main.py
        working-directory: nextmv/

      - name: smoketest binary
        env:
          NEXTMV_API_KEY: ${{ secrets.NEXTMV_API_KEY }}
          BINARY: ${{ matrix.os == 'windows-latest' && './nextmv.exe' || './nextmv' }}
        run: |
          $BINARY --help
          $BINARY configuration create -a $NEXTMV_API_KEY
          $BINARY version
          $BINARY community clone -a python-highs-knapsack
          cd python-highs-knapsack
          # Use Python to run command with timeout since timeout is not available on macOS.
          python3 -c "import subprocess; import os; subprocess.run(['.' + os.environ['BINARY'], 'local', 'run', 'create', '-i', 'input.json', '--wait'], timeout=30)"
        shell: bash
        working-directory: nextmv/dist
