name: single binary build
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  single-binary-build:
    name: Single binary build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Keep this in line with the matrix in the release workflow to ensure tests are accurate
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - os: macos
            arch: x64
            runner: macos-15-intel
            ext: ""
          - os: macos
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: windows
            arch: x64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller uv
          pip install .
        working-directory: nextmv/

      - name: build binary with PyInstaller
        shell: bash
        # Binary will be located at nextmv/dist/nextmv/nextmv (or nextmv/dist/nextmv/nextmv.exe on Windows)
        run: ./.github/scripts/build-single-binary.sh

      - name: smoketest binary
        env:
          NEXTMV_API_KEY: ${{ secrets.NEXTMV_API_KEY }}
          BINARY: ${{ matrix.os == 'windows' && './nextmv.exe' || './nextmv' }}
        run: |
          $BINARY --help
          $BINARY configuration create -a $NEXTMV_API_KEY
          $BINARY version
          $BINARY community clone -a python-highs-knapsack
          cd python-highs-knapsack
          # Use Python to run command with timeout since timeout is not available on macOS.
          python -c "import subprocess; import os; subprocess.run(['.' + os.environ['BINARY'], 'local', 'run', 'create', '-i', 'input.json', '--wait'], timeout=30)"
        shell: bash
        working-directory: nextmv/dist/nextmv
