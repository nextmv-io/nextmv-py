name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: [push]

permissions:
  contents: read

jobs:
  # >>> 'nextmv' package jobs.
  release-nextmv:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    permissions:
      contents: write
      pull-requests: write
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: nextmv-py
      LANGUAGE: python
      PACKAGE_NAME: nextmv
      PACKAGE_LOCATION: ./nextmv
      VERSION_FILE: __about__.py
      VERSION_PREFIX: nextmv-
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
      NEXTMVBOT_SSH_KEY: ${{ secrets.NEXTMVBOT_SSH_KEY }}
      NEXTMVBOT_SIGNING_KEY: ${{ secrets.NEXTMVBOT_SIGNING_KEY }}

  release-binaries:
    name: Release ${{ matrix.os }}-${{ matrix.arch }} binaries
    needs: [release-nextmv]
    if: ${{ needs.release-nextmv.outputs.RELEASE_NEEDED == 'true' }}
    permissions:
      contents: write # This is required for uploading assets to GitHub releases
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - os: macos
            arch: x64
            runner: macos-15-intel
            ext: ""
          - os: macos
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: windows
            arch: x64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: build and zip binary
        id: build-binary
        uses: ./.github/actions/build-binary
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

      - name: determine exact version being released
        shell: bash
        run: |
          VERSION="nextmv-$(cat nextmv/nextmv/__about__.py | grep __version__ | cut -d '"' -f 2)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION"

      - name: attach binary to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_NAME: ${{ steps.build-binary.outputs.zip-name }}
        run: |
          gh release upload $VERSION dist/$ZIP_NAME --clobber
        working-directory: nextmv/

  # Unfortunately, PyPI publishing does not support reusable workflows, so we
  # must publish here and do copy-pasting below as well. Sorry.
  publish-nextmv:
    needs: [release-nextmv, release-binaries]
    if: ${{ needs.release-nextmv.outputs.RELEASE_NEEDED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nextmv
    permissions:
      id-token: write # This is required for trusted publishing to PyPI
    steps:
      - name: git clone ${{ github.ref_name }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install build hatch

      - name: python - build binary wheel and source tarball
        run: python -m build
        working-directory: ./nextmv

      - name: python - publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ./nextmv/dist

  notify-nextmv:
    needs: [release-nextmv, publish-nextmv]
    if: ${{ needs.release-nextmv.outputs.RELEASE_NEEDED == 'true' && needs.release-nextmv.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    with:
      PACKAGE_NAME: nextmv
      VERSION: ${{ needs.release-nextmv.outputs.VERSION }}
      REPOSITORY: nextmv-py
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}

  # Submit the winget package for the nextmv CLI. We run this here (rather than
  # reacting to the release event) because releases are created with the
  # GITHUB_TOKEN, which does not trigger release-triggered workflows. Only run
  # for full, stable nextmv releases (SHOULD_NOTIFY_SLACK filters out dev tags)
  # and once the binaries (including the windows zip) are attached.
  release-winget:
    name: Release winget package
    needs: [release-nextmv, release-binaries]
    if: ${{ needs.release-nextmv.outputs.RELEASE_NEEDED == 'true' && needs.release-nextmv.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    runs-on: windows-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: resolve version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-nextmv.outputs.VERSION }}
        run: |
          VERSION="${RELEASE_VERSION#nextmv-}"  # strip 'nextmv-' prefix if present
          VERSION="${VERSION#v}"                # strip leading 'v' if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"

      - name: submit winget package
        uses: ./.github/actions/submit-winget
        with:
          version: ${{ steps.version.outputs.version }}
          winget-token: ${{ secrets.WINGET_TOKEN }}

  # >>> 'nextmv-gurobipy' package jobs.
  release-nextmv-gurobipy:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    permissions:
      contents: write
      pull-requests: write
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: nextmv-py
      LANGUAGE: python
      PACKAGE_NAME: nextmv_gurobipy
      PACKAGE_LOCATION: ./nextmv-gurobipy
      VERSION_FILE: __about__.py
      VERSION_PREFIX: nextmv-gurobipy-
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
      NEXTMVBOT_SSH_KEY: ${{ secrets.NEXTMVBOT_SSH_KEY }}
      NEXTMVBOT_SIGNING_KEY: ${{ secrets.NEXTMVBOT_SIGNING_KEY }}

  publish-nextmv-gurobipy:
    needs: [release-nextmv-gurobipy]
    if: ${{ needs.release-nextmv-gurobipy.outputs.RELEASE_NEEDED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nextmv-gurobipy
    permissions:
      id-token: write # This is required for trusted publishing to PyPI
    steps:
      - name: git clone ${{ github.ref_name }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install build hatch

      - name: python - build binary wheel and source tarball
        run: python -m build
        working-directory: ./nextmv-gurobipy

      - name: python - publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ./nextmv-gurobipy/dist

  notify-nextmv-gurobipy:
    needs: [release-nextmv-gurobipy, publish-nextmv-gurobipy]
    if: ${{ needs.release-nextmv-gurobipy.outputs.RELEASE_NEEDED == 'true' && needs.release-nextmv-gurobipy.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    with:
      PACKAGE_NAME: nextmv_gurobipy
      VERSION: ${{ needs.release-nextmv-gurobipy.outputs.VERSION }}
      REPOSITORY: nextmv-py
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}

  # >>> 'nextmv-scikit-learn' package jobs.
  release-nextmv-scikit-learn:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    permissions:
      contents: write
      pull-requests: write
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: nextmv-py
      LANGUAGE: python
      PACKAGE_NAME: nextmv_sklearn
      PACKAGE_LOCATION: ./nextmv-scikit-learn
      VERSION_FILE: __about__.py
      VERSION_PREFIX: nextmv-scikit-learn-
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
      NEXTMVBOT_SSH_KEY: ${{ secrets.NEXTMVBOT_SSH_KEY }}
      NEXTMVBOT_SIGNING_KEY: ${{ secrets.NEXTMVBOT_SIGNING_KEY }}

  publish-nextmv-scikit-learn:
    needs: [release-nextmv-scikit-learn]
    if: ${{ needs.release-nextmv-scikit-learn.outputs.RELEASE_NEEDED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nextmv-scikit-learn
    permissions:
      id-token: write # This is required for trusted publishing to PyPI
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install build hatch

      - name: Build package
        run: python -m build
        working-directory: ./nextmv-scikit-learn

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ./nextmv-scikit-learn/dist

  notify-nextmv-scikit-learn:
    needs: [release-nextmv-scikit-learn, publish-nextmv-scikit-learn]
    if: ${{ needs.release-nextmv-scikit-learn.outputs.RELEASE_NEEDED == 'true' && needs.release-nextmv-scikit-learn.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    with:
      PACKAGE_NAME: nextmv_sklearn
      VERSION: ${{ needs.release-nextmv-scikit-learn.outputs.VERSION }}
      REPOSITORY: nextmv-py
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
