name: release
run-name: Release ${{ inputs.PACKAGE }} ${{ inputs.VERSION }} by @${{ github.actor }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "The version to release"
        required: true
      PACKAGE:
        description: "The package to release"
        required: true
        type: choice
        options:
          - nextmv
          - nextmv-gurobipy
          - nextmv-scikit-learn
  push:
    # TODO: add develop branch here after testing.

env:
  PYTHON_VERSION: "3.13"

jobs:
  set-packages: # This job is used to detect which packages must be released
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.VERSION }}
      PACKAGE_VERSION: "${{ inputs.PACKAGE }}-${{ inputs.VERSION }}"
      GH_TOKEN: ${{ github.token }}
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      PACKAGE_NAMES: "nextmv,nextmv-gurobipy,nextmv-scikit-learn"
      PACKAGES: ""
      IS_PRE_RELEASE: true
    permissions:
      contents: write
    outputs:
      packages: ${{ steps.outputs.outputs.packages }}
      is_pre_release: ${{ steps.outputs.outputs.is_pre_release }}
    steps:
      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install hatch

      - name: configure git with the bot credentials
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.NEXTMVBOT_SSH_KEY }}"

          echo "${{ secrets.NEXTMVBOT_SIGNING_KEY }}" > ~/.ssh/signing.key
          chmod 600 ~/.ssh/signing.key

          git config --global user.name "nextmv-bot"
          git config --global user.email "tech+gh-nextmv-bot@nextmv.io"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing.key

          git clone git@github.com:nextmv-io/nextmv-py.git
          cd nextmv-py
          git switch ${{ github.ref_name }}

      - name: set the pre_release flag based on workflow dispatch
        run: |
          if [ ${{ github.event_name }} == "workflow_dispatch" ]; then
            echo "IS_PRE_RELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRE_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: upgrade version with hatch
        if: ${{ env.IS_PRE_RELEASE == true }}
        run: hatch version ${{ env.VERSION }}
        working-directory: ./nextmv-py/${{ inputs.PACKAGE }}

      - name: set filters file for changed paths
        if: ${{ env.IS_PRE_RELEASE == false }}
        run: |
          FILTERS_FILE="./.github/filters.yml"
          touch $FILTERS_FILE
          for package_name in ${{ env.PACKAGE_NAMES }}; do
            echo "${package_name}:" >> $FILTERS_FILE
            echo "  - '${package_name}/**/__about__.py'" >> $FILTERS_FILE
          done

          echo "Successfully created filters and wrote them to ${FILTERS_FILE}"
          cat $FILTERS_FILE
        working-directory: ./nextmv-py

      - name: filter changed directories
        if: ${{ env.IS_PRE_RELEASE == false }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/filters.yml
          working-directory: ./nextmv-py

      - name: create comma-separated string of changed packages - automated
        if: ${{ env.IS_PRE_RELEASE == false }}
        run: |
          export PACKAGES=""
          OUTPUTS=$(echo '${{ toJson(steps.filter.outputs) }}' | jq .)
          for package_name in ${{ env.PACKAGE_NAMES }}; do
              if [ $(echo $OUTPUTS | jq -r --arg package_name "$package_name" '.[$package_name]') == "true" ]; then
              PACKAGES="${PACKAGES}${package_name},"
            fi
          done

          # Remove the trailing comma.
          PACKAGES="${PACKAGES%,}"
          echo "These are the packages to release => $PACKAGES"
          echo "PACKAGES=${PACKAGES}" >> $GITHUB_ENV

      - name: create comma-separated string of changed packages - manual
        if: ${{ env.IS_PRE_RELEASE == true }}
        run: |
          export PACKAGES="${{ inputs.PACKAGE }}"
          echo "These are the packages to release => $PACKAGES"
          echo "PACKAGES=${PACKAGES}" >> $GITHUB_ENV

      - name: set the outputs
        id: outputs
        run: |
          echo "packages=${{ env.PACKAGES }}" >> $GITHUB_OUTPUT
          echo "is_pre_release=${{ env.IS_PRE_RELEASE }}" >> $GITHUB_OUTPUT

  release: # This job is used for the actual release process
    runs-on: ubuntu-latest
    needs: set-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-env: pypi
            target-url: https://pypi.org/p/nextmv
          - target-env: testpypi
            target-url: https://test.pypi.org/p/nextmv
        package: ${{fromJson(needs.set-packages.outputs.packages)}}
        is_pre_release: ${{fromJson(needs.set-packages.outputs.is_pre_release)}}

    environment:
      name: ${{ matrix.target-env }}
      url: ${{ matrix.target-url }}
    permissions:
      contents: read
      id-token: write # This is required for trusted publishing to PyPI
    env:
      VERSION: ""
      PACKAGE_VERSION: ""
    steps:
      - name: configure git with the bot credentials
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.NEXTMVBOT_SSH_KEY }}"

          echo "${{ secrets.NEXTMVBOT_SIGNING_KEY }}" > ~/.ssh/signing.key
          chmod 600 ~/.ssh/signing.key

          git config --global user.name "nextmv-bot"
          git config --global user.email "tech+gh-nextmv-bot@nextmv.io"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing.key

          git clone git@github.com:nextmv-io/nextmv-py.git
          cd nextmv-py
          git switch ${{ github.ref_name }}

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install build hatch

      - name: set the package version
        run: |
          export VERSION=$(cat ./__about__.py)
          echo "VERSION=${{ env.VERSION }}" >> $GITHUB_ENV

          export PACKAGE_VERSION="${{ matrix.package }}-$VERSION"
          echo "PACKAGE_VERSION=${{ env.PACKAGE_VERSION }}" >> $GITHUB_ENV
        working-directory: ./nextmv-py/${{ matrix.package }}

      - name: tag new version
        run: |
          git tag ${{ env.PACKAGE_VERSION }}
          git push origin ${{ env.PACKAGE_VERSION }}
        working-directory: ./nextmv-py/${{ matrix.package }}

      - name: create release
        run: |
          PRERELEASE_FLAG=""
          if [ ${{ matrix.is_pre_release }} = true ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create ${{ env.PACKAGE_VERSION }} \
          --verify-tag \
          --generate-notes \
          --title "${{ matrix.package }} ${{ env.VERSION }}" $PRERELEASE_FLAG
        working-directory: ./nextmv-py/${{ matrix.package }}

      - name: ensure passing build
        run: python -m build
        working-directory: ./nextmv-py/${{ matrix.package }}

      - name: build binary wheel and source tarball
        run: python -m build
        working-directory: ./nextmv-py/${{ matrix.package }}

      - name: Publish package distributions to PyPI
        if: ${{ matrix.target-env == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./${{ matrix.package }}/dist

      - name: Publish package distributions to TestPyPI
        if: ${{ matrix.target-env == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ./${{ matrix.package }}/dist

      - name: notify slack
        run: |
          export DATA="{\"text\":\"Release notification - from `nextmv-py`: ${{ matrix.package }} ${{ env.VERSION }} (see <https://github.com/nextmv-io/nextmv-py/releases/${{ env.PACKAGE_VERSION }}|release notes> / <https://pypi.org/project/${{ matrix.package }}|PyPI>)\"}"
          curl -X POST -H 'Content-type: application/json' --data "$DATA" ${{ secrets.SLACK_URL_MISSION_CONTROL }}
